<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manga Colorizer</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>Manga Colorizer</h1>
  <p id="server" class="status">Checking server…</p>
  <label class="row"><input type="checkbox" id="site"> <span>Colorize on <strong id="origin"></strong></span></label>
  <p id="note" class="note" hidden></p>
  <label class="row"><input type="checkbox" id="originals"> Show originals</label>

  <div class="head"><h2>Look</h2><button class="link" id="reset" title="Reset everything to defaults">Reset</button></div>
  <div class="presets" id="presets"></div>
  <div class="field"><div class="label"><label for="saturation">Color strength</label><output data-for="saturation"></output></div>
    <input id="saturation" type="range" min="0" max="2.5" step="0.05"></div>
  <div class="field"><div class="label"><label for="warmth">Warmth</label><output data-for="warmth"></output></div>
    <input id="warmth" type="range" min="-1" max="1" step="0.05"></div>
  <div class="field"><div class="label"><label for="hue">Hue shift</label><output data-for="hue"></output></div>
    <input id="hue" type="range" min="-180" max="180" step="5"></div>
  <div class="field"><div class="label"><label for="clean_whites">Clean whites</label><output data-for="clean_whites"></output></div>
    <input id="clean_whites" type="range" min="0" max="1" step="0.05"></div>

  <div class="head"><h2>Model</h2></div>
  <label class="row">Detail <select id="size"></select></label>
  <div class="field"><div class="label"><label for="denoise">Denoise</label><output data-for="denoise"></output></div>
    <input id="denoise" type="range" min="0" max="75" step="5"></div>
  <label class="row"><input type="checkbox" id="skip_colored"> Keep already-colored pages</label>
  <p class="note">Changes apply when you let go of a slider and recolor the pages on screen. Double-click a slider to reset it.</p>
</body>
</html>
