[project]
name = "manga-colorizer"
version = "0.1.0"
description = "Self-hosted AI colorizer for whole manga books (PDF, EPUB, CBZ) with a drag-and-drop web UI"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

# Local runs use the CUDA 12.8 build of PyTorch. For CPU-only, change the URL to .../whl/cpu
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
