name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tests/**"
      - "LICENSE"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cu130
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=semver,pattern={{version}}
          - variant: cpu
            tags: |
              type=raw,value=cpu,enable={{is_default_branch}}
              type=semver,pattern={{version}}-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the CUDA image
        if: matrix.variant == 'cu130'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: ${{ matrix.tags }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TORCH_VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
